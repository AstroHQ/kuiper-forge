# Fill in and create with kubectl or your secrets tool; never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: kuiper-coordinator
type: Opaque
stringData:
  # DigitalOcean's connection string as it is (sslmode=require); with db-ca.crt below, Phoenix
  # verifies the server against DigitalOcean's CA
  database-url: postgresql://kuiper:PASSWORD@db-postgresql-nyc3-00000-do-user-0.db.ondigitalocean.com:25060/kuiper_phoenix?sslmode=require
  db-ca.crt: |
    -----BEGIN CERTIFICATE-----
    (the cluster's CA certificate, from its Connection details)
    -----END CERTIFICATE-----
  secret-key-base: (openssl rand -base64 48)
  encryption-key: (openssl rand -base64 32)
