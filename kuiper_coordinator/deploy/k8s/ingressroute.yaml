# Agents: TLS passes through to Phoenix (it does the mTLS), with a PROXY v2 header naming the
# real client, as for the Rust coordinator (KUIPER_GRPC__PROXY_PROTOCOL=true).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: kuiper-forge-grpc
spec:
  entryPoints: [websecure]
  routes:
    - match: HostSNI(`kuiper.example.com`)
      services:
        - name: kuiper-forge
          port: 9443
          proxyProtocol:
            version: 2
  tls:
    passthrough: true
---
# Admin UI, webhooks and the API: Phoenix's HTTP port, TLS ends at Traefik. With passthrough on
# the same host above, give these their own host (or entry point), since SNI routing takes the
# whole host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kuiper-forge-http
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`kuiper-admin.example.com`)
      kind: Rule
      services:
        - name: kuiper-forge
          port: 9480
  tls: {}
