[workspace]
# only release when a release PR is merged, not on every push to main
release_always = false
# only these bump a version; docs/chore/test-only changes don't cut a release
release_commits = "^(feat|fix|perf|refactor)(\\(.*\\))?!?:"
pr_labels = ["release"]
# same titles release.yml used to give them; release.yml now uploads binaries to these
git_release_name = "{{ package }} v{{ version }}"

[changelog]
# matches the format cocogitto used to write, so existing changelogs stay consistent.
# release-plz splices this in right after the header's trailing `- - -`, so no trimming.
# commit.remote.username rather than commit.author.name: release-plz 0.3.172 crashes
# looking up the author of its synthetic "update Cargo.lock dependencies" commit.
# It's unset for commits GitHub can't tie to an account, hence the `if`.
trim = false
body = """
## {{ package }}-v{{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{%- for group, commits in commits | group_by(attribute="group") %}
#### {{ group | striptags | trim }}
{%- for commit in commits %}
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }} - ({{ commit.id | truncate(length=7, end="") }}){% if commit.remote.username %} - *{{ commit.remote.username }}*{% endif %}
{%- endfor %}
{% endfor %}
- - -"""
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance Improvements" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^revert", group = "<!-- 4 -->Reverts" },
    { message = ".*", skip = true },
]
