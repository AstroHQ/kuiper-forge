<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} - KuiperForge</title>
    <link rel="stylesheet" href="/admin/static/basecoat-1.0.2.css">
    <script>
        // Basecoat's dark theme keys off html.dark, follow the OS setting
        (() => {
            const dark = matchMedia('(prefers-color-scheme: dark)');
            const apply = () => document.documentElement.classList.toggle('dark', dark.matches);
            apply();
            dark.addEventListener('change', apply);
        })();
    </script>
    <style>
        /* components come from Basecoat (shadcn/ui), this is only page layout and app-specific bits, on its theme variables */
        body { font-size: 14px; background: var(--background); color: var(--foreground); }
        td a { font-weight: 500; text-underline-offset: 4px; }
        td a:not(:hover) { text-decoration: none; }
        h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; line-height: 1.2; margin-bottom: 24px; }
        .container { max-width: 1280px; margin: 0 auto; padding: 32px 24px; }

        nav.topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            height: 56px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: color-mix(in oklch, var(--background) 90%, transparent);
            backdrop-filter: blur(8px);
        }
        .nav-links { display: flex; align-items: center; gap: 24px; }
        .nav-links a { color: var(--muted-foreground); font-weight: 500; text-decoration: none; transition: color 0.15s; }
        .nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--foreground); }
        .nav-links a.nav-brand { color: var(--foreground); font-weight: 700; font-size: 15px; margin-right: 12px; }
        .nav-user { display: flex; align-items: center; gap: 12px; color: var(--muted-foreground); }
        .nav-user form { display: contents; }

        .page-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
        .page-header h1 { margin-bottom: 0; }
        .agent-id-full { font-family: var(--font-mono); margin-top: 4px; }
        .card, .alert { margin-bottom: 24px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stats-grid .card { margin-bottom: 0; }
        .stat-label { color: var(--muted-foreground); font-weight: 500; }
        .stat-value { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.025em; line-height: 1; margin-top: 8px; }
        .stat-of { color: var(--muted-foreground); font-size: 1.25rem; font-weight: 600; }
        .stat-detail { margin-top: 8px; }

        .btn-group { display: flex; gap: 8px; align-items: center; }
        .btn-group form:not(.field), .inline-form form { display: contents; }
        .field.availability { width: auto; white-space: nowrap; }
        tr.row-link { cursor: pointer; }
        .availability input[role=switch], .availability label { cursor: pointer; }
        .inline-form { display: flex; gap: 8px; align-items: center; }
        td .inline-form .input { width: 150px; }
        .table td { vertical-align: top; }
        .nowrap, time { white-space: nowrap; }
        .muted { color: var(--muted-foreground); font-size: 12px; }
        .empty-text { color: var(--muted-foreground); }
        .empty-center { text-align: center; padding: 32px 0; }
        .agent-id { font-family: var(--font-mono); font-size: 11px; word-break: break-all; max-width: 18em; white-space: normal; }
        .failure-message, .table td:has(> .failure-message) { white-space: pre-wrap; }
        .detail-grid { display: grid; grid-template-columns: 160px 1fr; gap: 12px 16px; }
        .detail-label { color: var(--muted-foreground); font-weight: 500; }

        /* runner labels, base set then one row per mapping */
        .badge.label-chip { font-family: var(--font-mono); font-weight: 500; margin: 1px 0; }
        .label-sets > div { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 4px; }
        .label-plus { color: var(--muted-foreground); }

        /* shadcn has no success/warning badge, so status is an outline badge with a colored dot */
        .badge[data-status]::before { content: ""; width: 6px; height: 6px; border-radius: 9999px; background: currentColor; }
        .badge[data-status="ok"]::before { background: oklch(0.72 0.19 150); }
        .badge[data-status="warn"]::before { background: oklch(0.8 0.16 80); }
        .badge[data-status="bad"]::before { background: var(--destructive); }
        .badge[data-status="idle"]::before { background: var(--muted-foreground); }
        .update-badge { margin-top: 4px; text-decoration: none; }

        .secret {
            display: block;
            margin: 12px 0;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 2px);
            background: var(--muted);
            font-family: var(--font-mono);
            font-size: 13px;
            word-break: break-all;
        }
        code { font-family: var(--font-mono); font-size: 0.85em; word-break: break-all; }
        .tabs { margin-bottom: 24px; }
        .tabs > [role=tablist] > a[role=tab] { text-decoration: none; }

        .log-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
        .log-toolbar .select { width: auto; }
        .log-toolbar label { display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .log-view {
            background: oklch(14.5% 0 0);
            color: oklch(87% 0 0);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            max-height: 70vh;
            overflow: auto;
        }
        .log-line { white-space: pre-wrap; word-break: break-word; }
        .log-time { color: oklch(55% 0 0); }
        .log-target { color: oklch(62% 0 0); }
        .log-ERROR { color: oklch(0.71 0.19 22); font-weight: bold; }
        .log-WARN { color: oklch(0.85 0.16 85); }
        .log-INFO { color: oklch(0.78 0.17 150); }
        .log-DEBUG, .log-TRACE { color: oklch(0.75 0.12 250); }
        .failure-message { white-space: pre-wrap; display: block; max-height: 12em; overflow: auto; font-size: 12px; }

        .dialog > div { width: min(800px, 90vw); max-width: none; }
        .dialog > div > section { overflow: auto; }
        .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--muted); }
        .login-page .card { width: 100%; max-width: 380px; margin: 0; }
        .login-page form { display: grid; gap: 16px; }
        .login-page .btn { width: 100%; }
        .alert .secret ~ p { margin-top: 12px; }
        .alert .btn { color: var(--foreground); }
    </style>
</head>
<body>
    {% block body %}{% endblock %}
    <script>
        // timestamps come from the server in UTC (see macros.html), show them in the browser's timezone instead
        (() => {
            const pad = (n, width = 2) => String(n).padStart(width, '0');
            const day = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
            const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
            const zone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'local';
            for (const el of document.querySelectorAll('time.local-time')) {
                const d = new Date(Number(el.dataset.ms));
                const utc = el.title || el.textContent;
                const full = `${day(d)} ${hm(d)}:${pad(d.getSeconds())}`;
                switch (el.dataset.fmt) {
                    case 'ms':
                        el.textContent = `${full}.${pad(d.getMilliseconds(), 3)}`;
                        el.title = `${utc} UTC`;
                        break;
                    case 'title':
                        el.title = `${full} ${zone}`;
                        break;
                    default:
                        el.textContent = `${day(d)} ${hm(d)}`;
                        el.title = utc;
                }
            }
            for (const el of document.querySelectorAll('.local-tz')) el.textContent = zone;
        })();

        // highlight the current section in the nav, agent pages belong to the dashboard
        (() => {
            const path = location.pathname.startsWith('/admin/agents/') ? '/admin/dashboard' : location.pathname;
            for (const a of document.querySelectorAll('nav .nav-links a:not(.nav-brand)')) {
                if (path.startsWith(a.getAttribute('href'))) a.setAttribute('aria-current', 'page');
            }
        })();
    </script>
</body>
</html>
