syntax = "proto3";

package cirunner.agent;

// ============================================================================
// Registration Service
// - Uses server-side TLS (encrypted) but no client certificate required
// - Registration tokens are SINGLE-USE: consumed immediately on success
// - Token validity window is short (default 1 hour)
// - A leaked token can only be used once before it becomes invalid
// ============================================================================

service RegistrationService {
    // Exchange registration token for client certificate
    // Token is invalidated after successful registration
    rpc Register(RegisterRequest) returns (RegisterResponse);
}

message RegisterRequest {
    string registration_token = 1;
    string hostname = 2;
    string agent_type = 3;  // "tart" or "proxmox"
    // Vestigial. The coordinator no longer reads these; the agent's labels
    // and max_vms travel in the first AgentStatus stream message and the
    // coordinator syncs its persisted record from there. Kept on the wire
    // for backward compatibility with older agents/coordinators — new code
    // sends defaults (empty / 0), old code's values are ignored on receive.
    repeated string labels = 4;
    uint32 max_vms = 5;
}

message RegisterResponse {
    string agent_id = 1;
    string client_cert_pem = 2;  // X.509 certificate signed by coordinator CA
    string client_key_pem = 3;   // Private key (transmitted over TLS, returned only once)
    string expires_at = 4;       // Certificate expiry (ISO 8601)
    string server_ca_pem = 5;     // Optional CA certificate for verifying coordinator TLS
    string server_trust_mode = 6; // "ca" or "chain"
}

// ============================================================================
// Agent Service (requires mTLS - agent identity from certificate)
// ============================================================================

service AgentService {
    // Bidirectional streaming for agent-coordinator communication
    rpc AgentStream(stream AgentMessage) returns (stream CoordinatorMessage);

    // Batched upload of the agent's own log lines (not runner logs), kept off the stream so log volume can't
    // delay commands. Coordinators without this rpc answer UNIMPLEMENTED and agents stop uploading.
    rpc UploadLogs(LogBatch) returns (UploadLogsResponse);
}

message LogBatch {
    repeated LogRecord records = 1;
    // Lines the agent dropped since the last batch because its buffer was full
    uint64 dropped = 2;
}

message LogRecord {
    int64 timestamp_micros = 1;  // Unix time on the agent
    string level = 2;            // "ERROR", "WARN", "INFO", "DEBUG", "TRACE"
    string target = 3;           // tracing target, usually the module path
    string message = 4;          // message plus any structured fields as key=value
    uint64 seq = 5;              // per-process counter, breaks ties between equal timestamps
}

message UploadLogsResponse {}

// Messages FROM agent TO coordinator
message AgentMessage {
    oneof payload {
        AgentStatus status = 1;
        CommandResult result = 2;
        Pong pong = 3;
        CommandAck ack = 4;
        RunnerEvent runner_event = 5;
    }
}

message AgentStatus {
    uint32 active_vms = 1;
    uint32 available_slots = 2;
    repeated VmInfo vms = 3;
    // Identity fields - only required in first message when mTLS is disabled
    // When mTLS is enabled, agent_id is extracted from certificate CN
    string agent_id = 4;      // Agent ID from registration
    string hostname = 5;      // Hostname for display
    string agent_type = 6;    // "tart" or "proxmox"
    repeated string labels = 7;  // Base agent labels (deprecated, use label_sets)
    uint32 max_vms = 8;       // Maximum VMs this agent can handle
    // Each label set represents one capability the agent can fulfill.
    // A job matches if its labels are a subset of ANY label set.
    // Example: [["self-hosted","macos","sequoia"], ["self-hosted","macos","ventura"]]
    repeated LabelSet label_sets = 9;
    // Agent build version, e.g. "0.4.0". Empty from agents that predate this field
    string agent_version = 10;
    // Extra host-wide limits on top of max_vms. Which VMs count against which limit comes from LabelSet.limits. Empty
    // from agents that only have max_vms
    repeated CapacityLimit limits = 11;
    // Runner programs this agent can start besides the GitHub Actions runner, e.g. ["forgejo"]. Jobs from a forge
    // only go to agents that list its kind. Empty from older agents: GitHub only
    repeated string runner_kinds = 12;
}

// A host-wide VM limit, e.g. tart's macOS guest limit
message CapacityLimit {
    string name = 1;      // "macos", "total"
    uint32 max = 2;
    uint32 external = 3;  // VMs counted against this limit that the agent doesn't manage
    uint32 active = 4;    // the agent's own VMs counted against this limit
}

// A set of labels representing one capability an agent can fulfill.
message LabelSet {
    repeated string labels = 1;
    // Names of the CapacityLimits a VM for this set counts against, e.g. ["macos", "total"] for a macOS image,
    // ["total"] for a linux one. When every set leaves this empty (older agents), every VM counts against every limit
    repeated string limits = 2;
    // Runners to keep for this set in fixed-capacity mode. Unset on every set (older agents, or none configured) means
    // the legacy pool: base labels, max_vms runners
    optional uint32 pool_size = 3;
    // The resource runners for this set are created from (tart image, proxmox template VMID). The coordinator sends it
    // back in CreateRunnerCommand.label_set_id for pool runners. Empty from older agents
    string id = 4;
    // The agent's default resource, used for jobs that don't ask for any mapping. A mapping can have the same labels,
    // so this can't be told from the labels
    bool is_default = 5;
}

message VmInfo {
    string vm_id = 1;
    string name = 2;
    string state = 3;  // "creating", "running", "stopping"
    string ip_address = 4;
}

message CommandAck {
    string command_id = 1;
    bool accepted = 2;
    string error = 3;
}

message RunnerEvent {
    string runner_name = 1;
    string vm_id = 2;
    RunnerEventType event_type = 3;
    string error = 4;
    // How long each step took, by the agent's clock. Sent on STARTED (the steps so far) and on the final
    // COMPLETED/FAILED. Unset from older agents and on DESTROYED
    RunnerTimings timings = 5;

    enum RunnerEventType {
        RUNNER_EVENT_TYPE_UNSPECIFIED = 0;
        STARTED = 1;
        COMPLETED = 2;
        FAILED = 3;
        DESTROYED = 4;
    }
}

// Step durations for one runner, by the agent's clock
message RunnerTimings {
    // step name to milliseconds. Steps so far: "create" (clone the VM), "boot" (until SSH answers), "install" (get
    // the runner onto the VM), "setup" (the rest of getting the runner ready), "job" (the runner's run), "destroy". Agents can add
    // steps without a proto change. A step that didn't run is left out, 0 means it was skipped (say "install" when the
    // runner is already in the image). Time spent in a step more than once is added up
    map<string, uint64> steps_ms = 1;
    string failed_phase = 2;  // the step that failed, empty if nothing did
    string image = 3;         // the image (tart image, proxmox template) the VM came from
    // where the runner came from: "hit" (the agent's copy), "filled" (the agent's copy, which had to be downloaded first),
    // "vm" (the VM downloaded it, no cache), "fell_back" (the VM downloaded it, the cache didn't work out). Empty if the
    // image has it
    string install_source = 4;
}

message CommandResult {
    string command_id = 1;
    bool success = 2;
    string error = 3;
    oneof result {
        CreateRunnerResult create_runner = 4;
        DestroyRunnerResult destroy_runner = 5;
    }
}

message CreateRunnerResult {
    string vm_id = 1;
    string ip_address = 2;
}

message DestroyRunnerResult {
    // Empty - just indicates success
}

message Pong {}

// Messages FROM coordinator TO agent
message CoordinatorMessage {
    oneof payload {
        CreateRunnerCommand create_runner = 1;
        DestroyRunnerCommand destroy_runner = 2;
        Ping ping = 3;
    }
}

message CreateRunnerCommand {
    string command_id = 1;
    string vm_name = 2;             // Runner/VM name (coordinator assigns for global numbering)
    string registration_token = 3;  // GitHub runner registration token (legacy, used in fixed-capacity mode)
    repeated string labels = 4;     // Labels for GitHub runner registration
    string runner_scope_url = 5;    // GitHub org/repo URL for runner registration
    string jit_config = 6;          // JIT config blob (webhook mode): if set, skip config.sh and use run.sh --jitconfig
    string label_set_id = 7;        // LabelSet.id to create from (fixed-capacity pools). Empty: pick by labels
    // Set for Forgejo jobs: run `forgejo-runner one-job` for this job attempt instead of the GitHub runner.
    // registration_token, runner_scope_url and jit_config are unused then. Only sent to agents listing "forgejo"
    // in AgentStatus.runner_kinds
    ForgejoRunner forgejo = 8;
}

// An ephemeral Forgejo runner registered for one job attempt
message ForgejoRunner {
    string instance_url = 1;  // Forgejo URL the runner connects to (one-job --url)
    string uuid = 2;          // runner UUID from registration (--uuid)
    string token = 3;         // runner token from registration, read from a file (--token-url)
    string handle = 4;        // the job attempt to run (--handle), needs forgejo-runner 13.1+
}

message DestroyRunnerCommand {
    string command_id = 1;
    string vm_id = 2;
}

message Ping {}
