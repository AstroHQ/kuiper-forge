[env]
KUIPER_CA_ORG = "KuiperOrg"
GITHUB_APP_ID = "12345"
GITHUB_PRIVATE_KEY = "--- key here ---"

[tasks.precommit]
run = [
    "cargo clippy --all-targets -- -D clippy::uninlined_format_args",
    "cargo fmt",
    "cargo test --all"
]

[tasks.clippy-fix]
run = "cargo clippy --all-targets --fix --allow-dirty -- -D clippy::uninlined_format_args"

[tasks."build:proxmox-musl"]
description = "Cross-build kuiper-proxmox-agent static musl binaries (x86_64 + arm64). Needs Docker."
run = "scripts/build-proxmox-agent-musl.sh"

[tasks."package:proxmox-agent"]
description = "Build a kuiper-proxmox-agent Linux package. Append 'arm64' for arm; set PACKAGERS to pick formats. Needs Docker + nfpm."
run = "scripts/package-proxmox-agent.sh"
