# nfpm config for kuiper-libvirt-agent Linux packages (deb/rpm).
#
# (apk/Alpine is intentionally not built yet: the service is a systemd unit and
# Alpine uses OpenRC, so there's no managed service there until an OpenRC init
# script is added.)
#
# Built via scripts/package-agent.sh, which exports VERSION and ARCH and stages
# the target binary at target/nfpm/kuiper-libvirt-agent before running nfpm from
# the repository root (so all `src` paths below are repo-relative).
#
# Note: nfpm expands ${ENV} in scalar fields (version, arch, ...) but NOT in
# contents[].src, which is globbed literally - hence the fixed staged path.
# Docs: https://nfpm.goreleaser.com/configuration/
name: kuiper-libvirt-agent
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
section: admin
priority: optional
maintainer: Astropad <jeremy@astropad.com>
vendor: Astropad
homepage: https://github.com/AstroHQ/kuiper-forge
license: MIT
description: |
  libvirt/KVM agent for kuiper-forge.
  Connects to a kuiper-forge coordinator and runs ephemeral CI runner VMs on
  this host through libvirt (qcow2 overlay, transient domain, destroy).

# the agent shells out to virsh and qemu-img. The daemon is only recommended so the
# package can still go on a box that points `libvirt.uri` somewhere else
overrides:
  deb:
    depends:
      - libvirt-clients
      - qemu-utils
    recommends:
      - libvirt-daemon-system
  rpm:
    depends:
      - libvirt-client
      - qemu-img
    recommends:
      - libvirt-daemon-kvm

contents:
  - src: target/nfpm/kuiper-libvirt-agent
    dst: /usr/bin/kuiper-libvirt-agent
    file_info:
      mode: 0755

  - src: kuiper-libvirt-agent/packaging/kuiper-libvirt-agent.service
    dst: /usr/lib/systemd/system/kuiper-libvirt-agent.service

  # Reference config showing every option. The live config in /etc is created by
  # the `register` subcommand, so this is documentation only.
  - src: examples/kuiper-libvirt-agent-config.toml
    dst: /usr/share/doc/kuiper-libvirt-agent/config.example.toml

scripts:
  postinstall: kuiper-libvirt-agent/packaging/scripts/postinstall.sh
  preremove: kuiper-libvirt-agent/packaging/scripts/preremove.sh
  postremove: kuiper-libvirt-agent/packaging/scripts/postremove.sh
