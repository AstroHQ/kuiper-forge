name: Phoenix coordinator

on:
  push:
    branches: [main]
    paths:
      - "kuiper_coordinator/**"
      - "kuiper-agent-proto/**"
      - "kuiper-agent-lib/**"
      - ".github/workflows/phoenix.yml"
  pull_request:
    paths:
      - "kuiper_coordinator/**"
      - "kuiper-agent-proto/**"
      - "kuiper-agent-lib/**"
      - ".github/workflows/phoenix.yml"

permissions:
  contents: read

env:
  MIX_ENV: test
  # keep in sync with kuiper_coordinator/mise.toml
  OTP_VERSION: "28.5"
  ELIXIR_VERSION: "1.19.6-otp-28"

defaults:
  run:
    working-directory: kuiper_coordinator

jobs:
  test:
    name: Format, compile, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            kuiper_coordinator/deps
            kuiper_coordinator/_build
          key: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('kuiper_coordinator/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Get deps
        run: mix deps.get --check-locked

      - name: Formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Generated protos are up to date
        run: |
          mix proto.gen
          # Intent-to-add new files, then compare against HEAD (not the index)
          # so a committed module protoc no longer generates also counts.
          git add -N lib/kuiper_coordinator/proto
          git diff --exit-code HEAD -- lib/kuiper_coordinator/proto || {
            echo "::error::Generated proto modules are stale. Run 'mix proto.gen' in kuiper_coordinator/ and commit the result."
            exit 1
          }

      - name: Test
        run: mix test

  rust-agent:
    # A real kuiper-agent-lib agent (test/rust_agent_probe) registers, streams and uploads logs
    # against the Phoenix agent port, and the Rust CLI's management client uses the Phoenix
    # management socket.
    name: Real Rust agent
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: kuiper_coordinator/test/rust_agent_probe

      # no `--locked`: the probe has its own lock and release-plz doesn't bump the path deps in it, so a release PR
      # would fail here. the lock still fixes the third-party versions
      - name: Build the agent and management probes
        run: cargo build --manifest-path test/rust_agent_probe/Cargo.toml

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            kuiper_coordinator/deps
            kuiper_coordinator/_build
          key: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('kuiper_coordinator/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Get deps
        run: mix deps.get --check-locked

      - name: Test with the real agent
        env:
          KUIPER_AGENT_PROBE: test/rust_agent_probe/target/debug/kuiper-agent-probe
          KUIPER_MANAGEMENT_PROBE: test/rust_agent_probe/target/debug/kuiper-management-probe
        run: mix test --only rust_agent

  release:
    # The prod release boots the way docs/verify-real-agents.md runs it: migrate, then bin/server
    # with HTTP and the agent gRPC TLS listener on their own ports.
    name: Release smoke test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            kuiper_coordinator/deps
            kuiper_coordinator/_build
          key: mix-prod-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('kuiper_coordinator/mix.lock') }}
          restore-keys: mix-prod-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Build and boot the release
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost:5432/kuiper_coordinator_smoke
        run: bash scripts/release_smoke.sh

  docker:
    # The image boots as a drop-in for the Rust image (kuiper_coordinator/docs/swap-from-rust.md):
    # the Rust env names, the /data volume, agent port 9443, TLS-only Postgres via sslmode=require.
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: kuiper_coordinator
          file: kuiper_coordinator/Dockerfile
          load: true
          tags: kuiper-coordinator:ci
          cache-from: type=gha,scope=phoenix-ci
          cache-to: type=gha,mode=max,scope=phoenix-ci

      - name: Boot it with the Rust image's env
        env:
          IMAGE: kuiper-coordinator:ci
        run: bash scripts/docker_smoke.sh
