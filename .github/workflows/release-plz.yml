name: Release-plz

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publishes to crates.io, tags and creates GitHub releases for packages whose
  # version isn't published yet. Only does anything once a release PR is merged
  # (release_always = false in release-plz.toml).
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'AstroHQ' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # tags pushed with GITHUB_TOKEN don't trigger release.yml/docker.yml
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          version: 0.3.172
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens/updates the release PR with version bumps and changelog entries.
  # Waits for release: run in parallel, it compares against crates.io before
  # the just-merged versions are published and reopens a PR for them.
  release-pr:
    name: Release PR
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'AstroHQ' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: 0.3.172
        env:
          # a PR opened with GITHUB_TOKEN wouldn't run CI
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
