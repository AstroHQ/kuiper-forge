name: Release

on:
  push:
    tags:
      - "kuiper-forge-v*"
      - "kuiper-tart-agent-v*"
      - "kuiper-proxmox-agent-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. kuiper-forge-v0.4.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.setup.outputs.matrix }}
      binary: ${{ steps.setup.outputs.binary }}
      version: ${{ steps.setup.outputs.version }}
    steps:
      - name: Parse tag and build matrix
        id: setup
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG##*-v}"
          BINARY="${TAG%-v*}"
          echo "binary=${BINARY}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          case "$BINARY" in
            kuiper-forge)
              MATRIX='[
                {"target":"x86_64-unknown-linux-musl","runner":"ubuntu-latest","cross":true,"archive":"tar.gz"},
                {"target":"aarch64-unknown-linux-musl","runner":"ubuntu-latest","cross":true,"archive":"tar.gz"},
                {"target":"x86_64-apple-darwin","runner":"macos-latest","cross":false,"archive":"tar.gz"},
                {"target":"aarch64-apple-darwin","runner":"macos-latest","cross":false,"archive":"tar.gz"}
              ]'
              ;;
            kuiper-tart-agent)
              MATRIX='[
                {"target":"x86_64-apple-darwin","runner":"macos-latest","cross":false,"archive":"tar.gz"},
                {"target":"aarch64-apple-darwin","runner":"macos-latest","cross":false,"archive":"tar.gz"}
              ]'
              ;;
            kuiper-proxmox-agent)
              MATRIX='[
                {"target":"x86_64-unknown-linux-musl","runner":"ubuntu-latest","cross":true,"archive":"tar.gz"},
                {"target":"aarch64-unknown-linux-musl","runner":"ubuntu-latest","cross":true,"archive":"tar.gz"},
                {"target":"x86_64-apple-darwin","runner":"macos-latest","cross":false,"archive":"tar.gz"},
                {"target":"aarch64-apple-darwin","runner":"macos-latest","cross":false,"archive":"tar.gz"},
                {"target":"x86_64-pc-windows-msvc","runner":"windows-latest","cross":false,"archive":"zip"}
              ]'
              ;;
            *)
              echo "::error::Unknown binary: $BINARY"
              exit 1
              ;;
          esac

          echo "matrix=$(echo "$MATRIX" | jq -c '.')" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }} --package ${{ needs.setup.outputs.binary }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} --package ${{ needs.setup.outputs.binary }}

      - name: Package (unix)
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          BINARY="${{ needs.setup.outputs.binary }}"
          VERSION="${{ needs.setup.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="${BINARY}-v${VERSION}-${TARGET}.tar.gz"

          if [[ "$TARGET" != "aarch64-unknown-linux-musl" ]]; then
            strip "target/${TARGET}/release/${BINARY}" || true
          fi

          tar czf "${ARCHIVE}" -C "target/${TARGET}/release" "${BINARY}"
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Package (windows)
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          $binary = "${{ needs.setup.outputs.binary }}"
          $version = "${{ needs.setup.outputs.version }}"
          $target = "${{ matrix.target }}"
          $archive = "${binary}-v${version}-${target}.zip"
          Compress-Archive -Path "target\${target}\release\${binary}.exe" -DestinationPath $archive
          echo "ARCHIVE=$archive" >> $env:GITHUB_ENV

      # Build .deb/.rpm for the proxmox agent's Linux targets via nfpm (run from
      # the goreleaser/nfpm image, mirroring scripts/package-proxmox-agent.sh).
      - name: Package (deb/rpm)
        if: ${{ needs.setup.outputs.binary == 'kuiper-proxmox-agent' && endsWith(matrix.target, '-linux-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          export VERSION="${{ needs.setup.outputs.version }}"
          TARGET="${{ matrix.target }}"
          case "$TARGET" in
            x86_64-*)  export ARCH=amd64 ;;
            aarch64-*) export ARCH=arm64 ;;
            *) echo "::error::Unsupported package target: $TARGET"; exit 1 ;;
          esac

          # Stage the built binary at the fixed path nfpm.yaml references.
          mkdir -p target/nfpm target/packages
          cp "target/${TARGET}/release/kuiper-proxmox-agent" target/nfpm/kuiper-proxmox-agent

          for pkg in deb rpm; do
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$PWD":/work -w /work \
              -e VERSION -e ARCH \
              ghcr.io/goreleaser/nfpm:latest \
              package --config packaging/proxmox-agent/nfpm.yaml --packager "$pkg" --target target/packages
          done

          # Move packages to the repo root so they upload flat (no target/packages/
          # prefix), matching the tarballs — otherwise download-artifact nests them
          # under artifacts/target/packages/ and the release glob misses them.
          mv target/packages/*.deb target/packages/*.rpm ./
          ls -l ./*.deb ./*.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.setup.outputs.binary }}-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            *.deb
            *.rpm
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: GitHub Release
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "${{ inputs.tag || github.ref_name }}"
          --title "${{ needs.setup.outputs.binary }} v${{ needs.setup.outputs.version }}"
          --generate-notes
          artifacts/*
